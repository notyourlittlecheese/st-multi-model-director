<div id="mmd_settings" class="mmd-settings">
  <div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
      <b>Multi-Model Director</b>
      <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
      <label class="mmd-checkbox-row">
        <input id="mmd_enabled" type="checkbox" />
        <span>启用</span>
      </label>

      <label class="mmd-checkbox-row">
        <input id="mmd_manual_packet_enabled" type="checkbox" />
        <span>注入手动测试 Scene Packet</span>
      </label>

      <div class="mmd-two-col">
        <label>
          注入深度
          <select id="mmd_injection_depth">
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="4">4</option>
          </select>
        </label>

        <label>
          注入角色
          <select id="mmd_injection_role">
            <option value="system">System｜系统</option>
            <option value="user">User｜用户</option>
          </select>
        </label>
      </div>

      <label>
        手动测试 Scene Packet
        <textarea id="mmd_manual_packet" rows="7"></textarea>
      </label>

      <div class="mmd-profile-block">
        <label>
          Gemini 连接配置
          <select id="mmd_gemini_profile"></select>
        </label>
        <label>
          Gemini 模型
          <select id="mmd_gemini_model"></select>
        </label>
        <button id="mmd_test_gemini" type="button" class="menu_button mmd-button">检查 Gemini 配置</button>
      </div>

      <div class="mmd-profile-block">
        <label>
          GPT 连接配置
          <select id="mmd_gpt_profile"></select>
        </label>
        <label>
          GPT 模型
          <select id="mmd_gpt_model"></select>
        </label>
        <button id="mmd_test_gpt" type="button" class="menu_button mmd-button">检查 GPT 配置</button>
      </div>

      <div class="mmd-profile-block">
        <label>
          Validator 连接配置
          <select id="mmd_validator_profile"></select>
        </label>
        <label>
          Validator 模型
          <select id="mmd_validator_model"></select>
        </label>
        <button id="mmd_test_validator" type="button" class="menu_button mmd-button">检查 Validator 配置</button>
      </div>

      <div class="mmd-actions">
        <button id="mmd_refresh_profiles" type="button" class="menu_button">刷新配置</button>
        <button id="mmd_clear_packet" type="button" class="menu_button">清除 Packet</button>
      </div>

      <label>
        调试追踪
        <textarea id="mmd_debug_trace" rows="14" readonly></textarea>
      </label>

      <div class="mmd-debug-actions">
        <button id="mmd_copy_debug" type="button" class="menu_button">复制调试日志</button>
        <button id="mmd_clear_debug" type="button" class="menu_button danger">清空调试</button>
      </div>
    </div>
  </div>
</div>
